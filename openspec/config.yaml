schema: spec-driven

context: |
  项目：openagent — 基于 Pi SDK 的全屏 TUI 代码 Agent
  技术栈：TypeScript + Bun + @earendil-works/pi-coding-agent + @opentui/core + @opentui/react + react
  运行时：Bun（原生 TypeScript，无需编译）
  
  依赖：
  - Pi SDK（pi-coding-agent）：Agent 循环、工具系统、30+ LLM Provider
  - OpenTUI（@opentui/core + @opentui/react）：Zig 原生 TUI 引擎，内置 tree-sitter 代码高亮、
    ScrollBox 滚动区、Input 输入框、Code/Diff 组件。OpenCode 在用，生产验证。
  
  设计理念：
  - 全屏 TUI（Alternate screen buffer）
  - 比 Pi 默认 TUI 更简洁（不做 diff 渲染、kill ring、fuzzy 等复杂功能）
  - 利用 OpenTUI 内置组件（ScrollBox/Input/Code），不重复造轮子
  - React 绑定管理 UI 状态（消息列表、输入、运行状态）
  
  Pi SDK 集成方式：
  - createAgentSession() 创建 Agent 会话
  - 订阅事件系统（message_update, tool_execution_*, agent_end）
  - session.prompt() 发送用户输入
  - 内置工具：read, bash, edit, write

rules:
  proposal:
    - 保持简洁，MVP 范围不超过 5 个核心功能
    - 必须包含 "Non-goals" 部分，明确不做什么
  design:
    - 用 ASCII 图说明数据流和架构
    - 列出关键技术决策及理由
  tasks:
    - 每个任务不超过 2 小时
    - 按依赖顺序排列
